# Fase 1 — Infraestructura base del sistema documental
# Ningún secreto vive en este archivo: las contraseñas se leen desde ./secrets/*.txt
# (generados con scripts/generar-secretos.*) y la config no sensible desde .env

name: sistema-documental

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # La variable *_FILE hace que Postgres lea la contraseña desde un archivo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgres_app_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro # se ejecuta solo la primera vez
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432" # solo accesible desde tu máquina
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    secrets:
      - redis_password
    # La contraseña se lee del secreto al arrancar; nunca se escribe aquí
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes',
      ]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    # MinIO oficial ya no publica imágenes (repo archivado en abril 2026).
    # Usamos un fork comunitario compatible. Como la app habla el protocolo S3,
    # cambiar a otro backend (Garage, SeaweedFS, AWS S3) no afecta al código.
    image: ${STORAGE_IMAGE}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - storage_data:/data
    ports:
      - "127.0.0.1:${STORAGE_API_PORT}:9000" # API S3
      - "127.0.0.1:${STORAGE_CONSOLE_PORT}:9001" # consola web
    networks: [backend]

  api:
    # La API del sistema documental. Solo arranca con el perfil "app":
    #   docker compose --profile app up -d --build
    # En desarrollo diario se sigue usando "npm run start:dev" (puerto 3000).
    build: ./backend
    image: sistema-documental-api
    restart: unless-stopped
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0 # dentro del contenedor; hacia afuera solo 127.0.0.1 (ver ports)
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: docs_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      STORAGE_ENDPOINT: http://storage:9000 # la API habla con el almacenamiento por la red interna
      STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${STORAGE_API_PORT} # dirección que usa el navegador
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: documentos
      STORAGE_ACCESS_KEY_FILE: /run/secrets/storage_app_access_key
      STORAGE_SECRET_KEY_FILE: /run/secrets/storage_app_secret_key
      SESSION_SECRET_FILE: /run/secrets/session_secret
      COOKIE_SEGURA: ${COOKIE_SEGURA:-true} # seguro por defecto; en local sin https: false
      SWAGGER_HABILITADO: ${SWAGGER_HABILITADO:-false} # apagado por defecto
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    # Solo los secretos que la API necesita (ni el admin de la BD ni el root del almacenamiento)
    secrets:
      - postgres_app_password
      - redis_password
      - storage_app_access_key
      - storage_app_secret_key
      - session_secret
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    networks: [backend]
    # Endurecimiento: no puede modificar sus archivos ni ganar privilegios
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  portainer:
    # Panel web para administrar contenedores. Solo arranca con el perfil "admin":
    #   docker compose --profile admin up -d
    # ⚠ Tiene acceso al socket de Docker = control total del equipo. Úsalo solo en local.
    image: ${PORTAINER_IMAGE}
    restart: unless-stopped
    profiles: [admin]
    # Crea el usuario "admin" con la contraseña del secreto (sin asistente inicial)
    command: ["--admin-password-file", "/run/secrets/portainer_admin_password"]
    secrets:
      - portainer_admin_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:${PORTAINER_PORT}:9443" # solo HTTPS y solo desde tu máquina
    # Sin red "backend": Portainer habla con Docker por el socket, no necesita ver la BD

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  storage_data:
  portainer_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  portainer_admin_password:
    file: ./secrets/portainer_admin_password.txt
  storage_app_access_key:
    file: ./secrets/storage_app_access_key.txt
  storage_app_secret_key:
    file: ./secrets/storage_app_secret_key.txt
  session_secret:
    file: ./secrets/session_secret.txt